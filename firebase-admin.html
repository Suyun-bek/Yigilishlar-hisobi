<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Свод</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16241d; --paper: #f1f3ef; --line: #d6dad2; --panel: #ffffff;
    --accent: #2c6b4f; --accent-deep: #1c4a36; --accent-soft: #e2ebe3;
    --gold: #a8842f; --gold-soft: #f3ecd8;
    --zero: #f0efe8; --danger: #a13d2f; --danger-soft: #f6e6e2; --muted: #66756a;
    --serif: "IBM Plex Serif", Georgia, serif;
    --sans: "IBM Plex Sans", "Noto Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans);
    padding: 28px clamp(16px, 3vw, 36px) 40px; font-feature-settings: "tnum" 1, "lnum" 1;
  }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0 0 5px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 13px; font-weight: 600; margin-right: 4px; color: var(--muted); }
  .controls input[type=date] { padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px; font-family: var(--sans); background: var(--panel); }
  .controls select { font-family: var(--sans); }
  .controls button { padding: 8px 18px; background: var(--accent); color: #fff; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 13px; transition: background .15s; }
  .controls button:hover { background: var(--accent-deep); }
  .stats { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 4px; padding: 12px 18px; min-width: 150px; }
  .stat .num { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--accent-deep); line-height: 1.15; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#3fae6a; margin-right:7px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); max-height: 74vh; }
  table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  th, td { padding: 7px 11px; text-align: right; border-bottom: 1px solid #ececee; white-space: nowrap; }
  th { background: var(--accent-soft); position: sticky; top: 0; z-index: 2; font-weight: 600; color: var(--accent-deep); text-align: right; }
  td:first-child, th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: left; font-weight: 600; border-right: 1px solid var(--line); }
  th:first-child { background: var(--accent-soft); z-index: 3; }
  tbody tr:nth-child(even) td:not(:first-child) { background: #f8f9f6; }
  .zero { color: #b8b6a8; background: var(--zero) !important; }
  .col-total { font-weight: 700; background: var(--gold-soft) !important; }
  .cell-clickable { cursor: pointer; }
  .cell-clickable:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  #detail { display: none; position: fixed; inset: 0; background: rgba(22,36,29,0.45); align-items: center; justify-content: center; padding: 20px; }
  #detail .box { background: var(--panel); border-radius: 8px; padding: 22px; max-width: 380px; width: 100%; }
  #detail h3 { margin: 0 0 12px; font-family: var(--serif); font-weight: 600; font-size: 17px; }
  #detail ul { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  #detail li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
  #detail button { margin-top: 16px; width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
  .empty { padding: 44px; text-align: center; color: var(--muted); font-size: 14px; }

  .tabs { display: flex; gap: 22px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab-btn {
    padding: 0 0 10px; background: none; border: none; border-bottom: 2px solid transparent;
    font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; margin-bottom: -1px;
    font-family: var(--sans); transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--accent-deep); border-bottom-color: var(--accent); }
  .breadcrumb { font-size: 13px; margin-bottom: 12px; color: var(--muted); }
  .breadcrumb a { color: var(--accent-deep); text-decoration: none; border-bottom: 1px solid var(--accent); cursor: pointer; }
  .drill-row { cursor: pointer; }
  .drill-row:hover td { background: var(--accent-soft) !important; }
  .drill-row td:first-child::after { content: ' →'; color: var(--accent); font-weight: 700; }

  .matrix-table th, .matrix-table td { padding: 5px 7px; font-size: 12px; }
  .matrix-table thead th { white-space: normal; word-break: keep-all; line-height: 1.25; max-width: 58px; }
  .matrix-table th.grp-first, .matrix-table td.grp-first { border-left: 1px dashed var(--line); }
  .matrix-table .total-row td { background: var(--gold-soft) !important; font-weight: 700; border-top: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold); }
  .matrix-table td:first-child, .matrix-table th:first-child { text-align: center; }
  .matrix-table td:nth-child(2), .matrix-table th:nth-child(2) { left: 36px; text-align: left; }
  .matrix-table .cnt-col { color: var(--muted); font-weight: 400; font-size: 10.5px; text-transform: none; }
  .matrix-table th > span.cnt-col { display: block; margin-top: 2px; }
  .matrix-table .idx-col { position: sticky; left: 0; background: var(--panel); z-index: 1; width: 32px; }
  .matrix-table th.idx-col { background: var(--accent-soft); z-index: 3; }
  .matrix-table thead tr:first-child th { font-family: var(--serif); font-weight: 600; font-size: 12.5px; }

  .simple-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .simple-table th, .simple-table td { padding: 9px 14px; text-align: left; border-bottom: 1px solid #ececee; }
  .simple-table th { background: var(--accent-soft); position: sticky; top: 0; font-weight: 600; color: var(--accent-deep); }
  .simple-table td.num, .simple-table th.num { text-align: right; }
  .overload-row td { background: var(--danger-soft) !important; }
  .overload-badge { display: inline-block; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 3px; margin-left: 8px; font-weight: 600; }
  .threshold-box { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
  .threshold-box input { width: 64px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; font-family: var(--sans); }
  .bar-list { padding: 20px; }
  .bar-row { margin-bottom: 14px; }
  .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-track { background: #e7e9e3; border-radius: 3px; height: 16px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  .trend-chart { display: flex; align-items: flex-end; gap: 4px; padding: 24px 20px; height: 220px; overflow-x: auto; }
  .trend-bar-wrap { display: flex; flex-direction: column; align-items: center; min-width: 22px; }
  .trend-bar { width: 15px; background: var(--accent); }
  .trend-val { font-size: 9px; color: var(--muted); margin-bottom: 3px; }
  .trend-date { font-size: 9px; color: #8b978d; margin-top: 5px; writing-mode: vertical-rl; transform: rotate(180deg); height: 50px; }
  .rank-cols { display: flex; gap: 24px; flex-wrap: wrap; padding: 20px; }
  .rank-col { flex: 1; min-width: 280px; }
  .rank-col h3 { font-family: var(--serif); font-weight: 600; font-size: 15px; margin: 0 0 12px; }
  .bank-logo-box { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 24px; flex: none; margin-right: 8px; }
  .bank-logo { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; }
  .bank-name-wrap { display: flex; align-items: center; white-space: nowrap; }

  #loginBox { max-width: 350px; margin: 90px auto; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 6px; padding: 28px; }
  #loginBox h2 { margin: 0 0 16px; font-family: var(--serif); font-weight: 600; font-size: 19px; }
  #loginBox input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 10px; font-size: 16px; font-family: var(--sans); }
  #loginBox button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
  #loginErr { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
  .switch-link { font-size: 13px; color: var(--accent-deep); text-decoration: underline; cursor: pointer; display: block; text-align: center; margin-top: 14px; }
  #app { display: none; }

  /* ====== ТЕЛЕФОН / ПЛАНШЕТ УЧУН МОСЛАШУВ ====== */
  @media (max-width: 760px) {
    body { padding: 14px 10px 30px; }
    header { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; }
    header h1 { font-size: 19px; }
    header p { font-size: 12.5px; }
    .controls { width: 100%; gap: 8px; }
    .controls label { width: 34px; }
    .controls input[type=date] { flex: 1; min-width: 0; }
    .controls select { flex: 1; min-width: 0; }
    .controls button { flex: 1; padding: 10px 8px; }
    .stats { gap: 8px; margin-bottom: 14px; }
    .stat { flex: 1 1 calc(50% - 8px); min-width: 0; padding: 10px 12px; }
    .stat .num { font-size: 21px; }
    .tabs {
      flex-wrap: nowrap; overflow-x: auto; gap: 16px; -webkit-overflow-scrolling: touch;
      padding-bottom: 2px; margin-bottom: 14px; scrollbar-width: thin;
    }
    .tab-btn { white-space: nowrap; flex: none; font-size: 13px; }
    .table-wrap { max-height: 64vh; border-radius: 5px; }
    .matrix-table th, .matrix-table td { padding: 4px 6px; font-size: 11px; }
    .matrix-table thead th { max-width: 44px; }
    .simple-table th, .simple-table td { padding: 7px 8px; font-size: 12.5px; }
    .rank-cols { flex-direction: column; gap: 18px; padding: 12px; }
    .rank-col { min-width: 0; }
    .trend-chart { padding: 16px 8px; }
    #loginBox { margin: 40px auto; max-width: 90%; padding: 22px; }
    .bank-logo-box { width: 24px; height: 20px; margin-right: 5px; }
    .threshold-box { flex-wrap: wrap; }
  }
  @media (max-width: 420px) {
    .stat { flex: 1 1 100%; }
    header h1 { font-size: 17px; }
  }
</style>
</head>
<body>

<div id="loginBox">
  <h2 id="loginTitle">Свод — кириш</h2>
  <input type="text" id="email" placeholder="Электрон почта">
  <input type="password" id="password" placeholder="Парол">
  <button id="loginBtn">Кириш</button>
  <div id="loginErr"></div>
  <div class="switch-link" id="toggleModeLink" onclick="window.__toggleAuthMode()">Ҳисобингиз йўқми? Рўйхатдан ўтинг</div>
</div>

<div id="app">
  <header>
    <div>
      <h1><span class="live-dot"></span>Раҳбарлар йиғилиш ҳисоби — свод</h1>
      <p>Маълумотлар жонли янгиланади. Катакни босиб турлар бўйича батафсилни кўринг.</p>
    </div>
    <div class="controls">
      <label>Дан</label><input type="date" id="startDate">
      <label>Гача</label><input type="date" id="endDate">
      <label>Вилоят</label>
      <select id="viloyatFilter" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;"><option value="">Барчаси</option></select>
      <button id="refreshBtn">Қайта ҳисоблаш</button>
      <button id="logoutBtn" style="background:#8a8577;">Чиқиш</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tabs" style="flex-wrap:wrap;">
    <button class="tab-btn active" data-tab="leaders">Раҳбарлар бўйича</button>
    <button class="tab-btn" data-tab="banks">Банклар бўйича</button>
    <button class="tab-btn" data-tab="regions">Ҳудудлар бўйича</button>
    <button class="tab-btn" data-tab="workload">Юклама</button>
    <button class="tab-btn" data-tab="types">Турлар бўйича</button>
    <button class="tab-btn" data-tab="trend">Тенденция</button>
    <button class="tab-btn" data-tab="ranking">Рейтинг</button>
    <button class="tab-btn" data-tab="missing">Киритмаганлар</button>
  </div>
  <div class="breadcrumb" id="breadcrumb" style="display:none;"></div>
  <div class="table-wrap" id="tableWrap"><div class="empty">Юкланмоқда...</div></div>
</div>

<div id="detail">
  <div class="box">
    <h3 id="detailTitle"></h3>
    <ul id="detailList"></ul>
    <button onclick="document.getElementById('detail').style.display='none'">Ёпиш</button>
  </div>
</div>

  document.getElementById('loginBtn').addEventListener('click', async function(){

    err.style.display = 'none';
    try {

  function startListening(){
    if (unsubscribe) unsubscribe();
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const q = query(collection(db, 'entries'), where('date', '>=', start), where('date', '<=', end));
    document.getElementById('tableWrap').innerHTML = '<div class="empty">Юкланмоқда...</div>';
    unsubscribe = onSnapshot(q, function(snap){
      const docs = [];
      snap.forEach(function(d){ docs.push(d.data()); });
      lastDocs = docs;
      populateViloyatFilter(docs);
      applyFilterAndRender();

  function populateViloyatFilter(docs){
    const sel = document.getElementById('viloyatFilter');
    const current = sel.value;
    const viloyats = Array.from(new Set(docs.map(function(d){ return d.viloyat; }).filter(Boolean))).sort(function(a,b){ return a.localeCompare(b); });
    sel.innerHTML = '<option value="">Барчаси</option>';
    viloyats.forEach(function(v){
      const o = document.createElement('option'); o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    if (viloyats.indexOf(current) !== -1) sel.value = current;
  }

  function getBaseFiltered(){
    const v = document.getElementById('viloyatFilter').value;

  function updateStats(rows, dates){
    let totalHours = 0;
    rows.forEach(function(r){ Object.values(r.days).forEach(function(v){ totalHours += v; }); });
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + rows.length + '</div><div class="label">Қатор</div></div>' +
      '<div class="stat"><div class="num">' + dates.length + '</div><div class="label">Кун (танланган даврда)</div></div>' +
      '<div class="stat"><div class="num">' + totalHours.toFixed(1) + '</div><div class="label">Жами соат</div></div>';
  }

  // Umumiy pivot quruvchi: docs'ni keyFn bo'yicha guruhlaydi, har bir sana uchun total yig'adi
  function buildPivot(docs, keyFn, makeRow){
    const map = {};
    const dateSet = {};
    docs.forEach(function(d){
      const key = keyFn(d);
      if (!map[key]) map[key] = makeRow(d);
      map[key].days[d.date] = (map[key].days[d.date] || 0) + (d.total || 0);
      map[key]._docs = map[key]._docs || [];
      map[key]._docs.push(d);
      dateSet[d.date] = true;
    });
    const dates = Object.keys(dateSet).sort();
    const rows = Object.values(map).sort(function(a,b){ return a.label.localeCompare(b.label); });
    return { dates: dates, rows: rows };
  }

  function renderPivotTable(pivot, opts){
    opts = opts || {};
    const dates = pivot.dates, rows = pivot.rows;
    if (!rows.length || !dates.length) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Танланган даврда маълумот топилмади.</div>';
      updateStats([], []);
      return;
    }
    updateStats(rows, dates);
    window.__lastRows = rows;

    let html = '<table><thead><tr><th>' + (opts.rowHeader || 'Ном') + '</th>';
    dates.forEach(function(d){ html += '<th>' + fmtDate(d) + '</th>'; });
    html += '<th class="col-total">Жами</th></tr></thead><tbody>';

    rows.forEach(function(r, ri){
      const rowClass = opts.onRowClick ? ' class="drill-row"' : '';
      const rowClick = opts.onRowClick ? ' onclick="window.__rowClick(' + ri + ')"' : '';
      html += '<tr' + rowClass + rowClick + '><td>' + escapeHtml(r.label) +
        (r.sub ? '<br><span style="font-weight:400;color:#889">' + escapeHtml(r.sub) + '</span>' : '') +
        (r.sub2 ? '<br><span style="font-weight:400;color:#aab;font-size:11px">' + escapeHtml(r.sub2) + '</span>' : '') + '</td>';
      let rowTotal = 0;
      dates.forEach(function(d){
        const v = r.days[d];
        rowTotal += (v || 0);
        if (v) {
          const cellClick = opts.onCellClick ? (' class="cell-clickable" onclick="event.stopPropagation();window.__cellClick(' + ri + ',\'' + d + '\')"') : '';
          html += '<td' + cellClick + '>' + v.toString().replace('.', ',') + '</td>';
        } else {
          html += '<td class="zero">—</td>';
        }
      });
      html += '<td class="col-total">' + rowTotal.toFixed(1).replace('.', ',') + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('tableWrap').innerHTML = html;

    window.__rowClick = opts.onRowClick ? function(ri){ opts.onRowClick(rows[ri]); } : function(){};
    window.__cellClick = opts.onCellClick ? function(ri, date){ opts.onCellClick(rows[ri], date); } : function(){};
  }

  function showDetailForDocs(docs, date, title){
    const dayDocs = docs.filter(function(d){ return d.date === date; });
    document.getElementById('detailTitle').textContent = title + ' — ' + fmtDate(date);
    const list = document.getElementById('detailList');
    let items = [];
    dayDocs.forEach(function(d){
      if (d.meetings && d.meetings.length) {
        d.meetings.forEach(function(m){
          const who = dayDocs.length > 1 ? (d.name + ': ') : '';
          const timePart = m.time ? (m.time + ' — ') : '';
          items.push('<li><span>' + who + timePart + escapeHtml(m.type) + '</span><span>' + m.duration + ' соат</span></li>');
        });
      } else if (d.hours) {
        Object.keys(d.hours).filter(function(t){ return d.hours[t] > 0; }).forEach(function(t){
          const who = dayDocs.length > 1 ? (d.name + ': ') : '';
          items.push('<li><span>' + who + escapeHtml(t) + '</span><span>' + d.hours[t] + ' соат</span></li>');
        });
      }
    });
    list.innerHTML = items.join('') || '<li>Маълумот йўқ</li>';
    document.getElementById('detail').style.display = 'flex';
  }

  function renderCurrent(){
    document.getElementById('breadcrumb').style.display = 'none';
    if (currentTab === 'leaders') return renderLeadersTab();
    if (currentTab === 'banks') return renderDrillTab(BANK_LEVELS);
    if (currentTab === 'regions') return renderDrillTab(REGION_LEVELS);
    if (currentTab === 'workload') return renderWorkloadTab();
    if (currentTab === 'types') return renderTypesTab();
    if (currentTab === 'trend') return renderTrendTab();
    if (currentTab === 'ranking') return renderRankingTab();
    if (currentTab === 'missing') return renderMissingTab();
  }

  // ====== 1) ЮКЛАМА — ким доимий ортиқча йиғилишда бўлмоқда ======
  let workloadThreshold = 4;
  function renderWorkloadTab(){
    const docs = getBaseFiltered();
    const byLeader = {};
    docs.forEach(function(d){
      const key = d.filial || (d.name + '|' + d.dept);
      if (!byLeader[key]) byLeader[key] = { name: d.name, dept: d.dept, days: 0, totalHours: 0 };
      byLeader[key].days += 1;
      byLeader[key].totalHours += (d.total || 0);
    });
    const rows = Object.values(byLeader).map(function(r){
      r.avg = r.days ? (r.totalHours / r.days) : 0;
      return r;
    }).sort(function(a,b){ return b.avg - a.avg; });

    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + rows.length + '</div><div class="label">Маълумот киритган раҳбар</div></div>' +
      '<div class="stat"><div class="num">' + rows.filter(function(r){ return r.avg >= workloadThreshold; }).length + '</div><div class="label">Чегарадан юқори (' + workloadThreshold + '+ соат/кун)</div></div>';

    let html = '<div style="padding:16px 16px 0;">' +
      '<div class="threshold-box"><label>Огоҳлантириш чегараси (соат/кун):</label>' +
      '<input type="number" id="thresholdInput" value="' + workloadThreshold + '" min="1" max="12" step="0.5"></div></div>';

    if (!rows.length) {
      html += '<div class="empty">Танланган даврда маълумот топилмади.</div>';
    } else {
      html += '<table class="simple-table"><thead><tr><th>Раҳбар</th><th>Бўлим</th><th class="num">Кунлар сони</th><th class="num">Жами соат</th><th class="num">Ўртача кунлик соат</th></tr></thead><tbody>';
      rows.forEach(function(r){
        const over = r.avg >= workloadThreshold;
        html += '<tr' + (over ? ' class="overload-row"' : '') + '>' +
          '<td>' + escapeHtml(r.name) + (over ? '<span class="overload-badge">ЮКЛАНГАН</span>' : '') + '</td>' +
          '<td>' + escapeHtml(r.dept || '') + '</td>' +
          '<td class="num">' + r.days + '</td>' +
          '<td class="num">' + r.totalHours.toFixed(1) + '</td>' +
          '<td class="num"><b>' + r.avg.toFixed(1) + '</b></td></tr>';
      });
      html += '</tbody></table>';
    }
    document.getElementById('tableWrap').innerHTML = html;
    document.getElementById('thresholdInput').addEventListener('change', function(e){
      workloadThreshold = parseFloat(e.target.value) || 4;
      renderWorkloadTab();
    });
  }

  // ====== 2) ТУРЛАР БЎЙИЧА — қайси йиғилиш тури кўп вақт ейди ======
  function renderTypesTab(){
    const docs = getBaseFiltered();
    const totals = {};
    MEETING_TYPES.forEach(function(t){ totals[t] = 0; });
    let grandTotal = 0;
    docs.forEach(function(d){
      Object.keys(d.hours || {}).forEach(function(t){
        if (totals[t] === undefined) return;
        totals[t] += d.hours[t];
        grandTotal += d.hours[t];
      });
    });
    const sorted = MEETING_TYPES.map(function(t){ return { type: t, hours: totals[t] }; })
      .sort(function(a,b){ return b.hours - a.hours; });

    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + grandTotal.toFixed(1) + '</div><div class="label">Жами соат (барча турлар)</div></div>';

    if (!grandTotal) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Танланган даврда маълумот топилмади.</div>';
      return;
    }

    let html = '<div class="bar-list">';
    sorted.forEach(function(s){
      const pct = grandTotal ? (s.hours / grandTotal * 100) : 0;
      html += '<div class="bar-row">' +
        '<div class="bar-label"><span>' + escapeHtml(s.type) + '</span><span>' + s.hours.toFixed(1) + ' соат (' + pct.toFixed(1) + '%)</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div></div>';
    });
    html += '</div>';
    document.getElementById('tableWrap').innerHTML = html;
  }

  // ====== 3) ТЕНДЕНЦИЯ — вақт давомида ортиш/камайиш ======
  function renderTrendTab(){
    const docs = getBaseFiltered();
    const byDate = {};
    docs.forEach(function(d){
      if (!byDate[d.date]) byDate[d.date] = { total: 0, leaders: new Set() };
      byDate[d.date].total += (d.total || 0);
      byDate[d.date].leaders.add(d.name + '|' + d.dept);
    });
    const dates = Object.keys(byDate).sort();

    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + dates.length + '</div><div class="label">Маълумот бор кунлар</div></div>';

    if (!dates.length) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Танланган даврда маълумот топилмади.</div>';
      return;
    }

    const maxVal = Math.max.apply(null, dates.map(function(d){ return byDate[d].total; }));
    let html = '<div class="trend-chart">';
    dates.forEach(function(d){
      const v = byDate[d].total;
      const h = maxVal ? Math.max(4, Math.round(v / maxVal * 160)) : 4;
      const p = d.split('-');
      html += '<div class="trend-bar-wrap">' +
        '<div class="trend-val">' + (v ? v.toFixed(1) : '') + '</div>' +
        '<div class="trend-bar" style="height:' + h + 'px"></div>' +
        '<div class="trend-date">' + p[2] + '.' + p[1] + '</div></div>';
    });
    html += '</div>';
    document.getElementById('tableWrap').innerHTML = html;
  }

  // ====== 4) РЕЙТИНГ — банк/ҳудудлар ўртасида солиштириш ======
  function renderRankingTab(){
    const docs = lastDocs;
    function rankBy(field, refField, seedLabels){
      const map = {};
      seedLabels.forEach(function(label){ map[label] = { label: label, totalHours: 0, count: 0 }; });
      docs.forEach(function(d){
        const key = d[field];
        if (!key) return;
        if (!map[key]) map[key] = { label: key, totalHours: 0, count: 0 };
        map[key].totalHours += (d.total || 0);
        map[key].count += 1;
      });
      return Object.values(map).map(function(r){
        r.avg = r.count ? r.totalHours / r.count : 0;
        return r;
      }).sort(function(a,b){ return b.avg - a.avg || a.label.localeCompare(b.label); });
    }
    const allBanks = Array.from(new Set(LEADERS_DATA.map(function(r){ return r.b; })));
    const allViloyats = Array.from(new Set(LEADERS_DATA.map(function(r){ return r.v; })));
    const byBank = rankBy('bank', 'b', allBanks);
    const byRegion = rankBy('viloyat', 'v', allViloyats);

    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + byBank.length + '</div><div class="label">Жами банк</div></div>' +
      '<div class="stat"><div class="num">' + byRegion.length + '</div><div class="label">Жами вилоят</div></div>';

    function renderList(rows, label, withLogo){
      if (!rows.length) return '<p style="color:#889;font-size:13px;">Маълумот йўқ</p>';
      let h = '<table class="simple-table"><thead><tr><th>' + label + '</th><th class="num">Ёзувлар сони</th><th class="num">Ўртача кунлик соат</th></tr></thead><tbody>';
      rows.forEach(function(r){
        const nameHtml = withLogo
          ? '<span class="bank-name-wrap">' + bankLogoImg(r.label) + escapeHtml(r.label) + '</span>'
          : escapeHtml(r.label);
        h += '<tr><td>' + nameHtml + '</td><td class="num">' + r.count + '</td><td class="num"><b>' + r.avg.toFixed(1).replace('.', ',') + '</b></td></tr>';
      });
      h += '</tbody></table>';
      return h;
    }

    const html = '<div class="rank-cols">' +
      '<div class="rank-col"><h3>Банклар бўйича (ўртача кунлик соат)</h3>' + renderList(byBank, 'Банк', true) + '</div>' +
      '<div class="rank-col"><h3>Ҳудудлар бўйича (ўртача кунлик соат)</h3>' + renderList(byRegion, 'Вилоят') + '</div>' +
      '</div>';
    document.getElementById('tableWrap').innerHTML = html;
  }

  // ====== 5) КИРИТМАГАНЛАР — маълумот киритмаган филиаллар ======
  function renderMissingTab(){
    const docs = getBaseFiltered();
    const submittedFilials = new Set(docs.map(function(d){ return d.filial; }));
    const v = document.getElementById('viloyatFilter').value;
    const refPool = v ? LEADERS_DATA.filter(function(r){ return r.v === v; }) : LEADERS_DATA;
    const missing = refPool.filter(function(r){ return !submittedFilials.has(r.f); })
      .sort(function(a,b){ return a.v.localeCompare(b.v) || a.b.localeCompare(b.b); });

    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + missing.length + '</div><div class="label">Танланган даврда маълумот киритмаган</div></div>' +
      '<div class="stat"><div class="num">' + refPool.length + '</div><div class="label">Жами филиал</div></div>';

    if (!missing.length) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Ажойиб — барча филиаллар маълумот киритган!</div>';
      return;
    }

    let html = '<table class="simple-table"><thead><tr><th>Раҳбар</th><th>Банк</th><th>Вилоят</th><th>Туман</th></tr></thead><tbody>';
    missing.forEach(function(r){
      const bankHtml = '<span class="bank-name-wrap">' + bankLogoImg(r.b) + escapeHtml(r.b) + '</span>';
      html += '<tr><td>' + escapeHtml(r.n || '(исм рўйхатда йўқ)') + '</td><td>' + bankHtml + '</td><td>' + escapeHtml(r.v) + '</td><td>' + escapeHtml(r.t) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('tableWrap').innerHTML = html;
  }

  function renderLeadersTab(){
    document.getElementById('breadcrumb').style.display = 'none';
    const docs = getBaseFiltered();
    const pivot = buildPivot(docs,
      function(d){ return d.viloyat + '|' + d.tuman + '|' + d.name + '|' + d.dept; },
      function(d){
        const locLine = [d.viloyat, d.tuman].filter(Boolean).join(', ');
        return { label: d.name, sub: d.dept, sub2: locLine, days: {} };
      });
    renderPivotTable(pivot, {
      rowHeader: 'Раҳбар',
      onCellClick: function(row, date){ showDetailForDocs(row._docs, date, row.label); }
    });
  }

  const MEETING_TYPES = [
    "Президент селектори", "Администрация", "Вазирлар Маҳкамаси", "Вазирлик ва идоралар",
    "Марказий банк", "Марказий банк вилоят бош бошқармаси",
    "Тижорат банклари бошқаруви", "Тижорат банклари вилоят бошқармаси",
    "Ҳуқуқни муҳофаза қилувчи органлар (республика)", "Ҳуқуқни муҳофаза қилувчи органлар (ҳудуд)",
    "Ҳуқуқни муҳофаза қилувчи органлар (туман)",
    "Вилоят ҳокимлиги", "Туман (шаҳар) ҳокимлиги",
    "Бошқалар (республика)", "Бошқалар (ҳудуд)", "Бошқалар (туман)"
  ];

  // docs'ni keyFn bo'yicha guruhlaydi va har bir yig'ilish turi uchun
  // (a) yig'ilish soni va (b) ishtirok etgan (distinct) rahbarlar sonini hisoblaydi.
  // seedList (ixtiyoriy): [{key,label,sub}] — ma'lumot kelmagan bo'lsa ham 0 qator sifatida ko'rsatish uchun.
  // Вақтни 30 дақиқалик "уячалар"га яхлитлайди — деярли бир хил вақтда
  // киритилган ёзувларни битта воқеа сифатида бирлаштириш учун.
  function roundTimeSlot(time){
    if (!time) return 'vaqtsiz';
    const parts = time.split(':');
    const h = parseInt(parts[0], 10) || 0;
    const m = parseInt(parts[1], 10) || 0;
    const totalMin = h * 60 + m;
    const rounded = Math.round(totalMin / 30) * 30;
    const rh = Math.floor(rounded / 60) % 24;
    const rm = rounded % 60;
    return (rh < 10 ? '0' : '') + rh + ':' + (rm < 10 ? '0' : '') + rm;
  }

  // Ҳар бир йиғилиш тури қайси доирада "бир хил воқеа" деб ҳисобланиши:
  // 'national'      — бутун мамлакат бўйича бир хил вақт бўлса, битта воқеа (ким бўлса ҳам)
  // 'viloyat'       — фақат бир хил вилоятда бир хил вақт бўлса, битта воқеа
  // 'tuman'         — фақат бир хил вилоят+туманда бир хил вақт бўлса, битта воқеа
  // 'bank-national' — фақат бир хил БАНК бўйича, бутун мамлакатда бир хил вақт бўлса, битта воқеа
  // 'bank-viloyat'  — фақат бир хил БАНК ва бир хил вилоятда бир хил вақт бўлса, битта воқеа
  // 'none'          — ҳеч қачон бирлаштирилмайди (ҳар филиалнинг ўзи алоҳида)
  const TYPE_SCOPE = {
    "Президент селектори": "national",
    "Администрация": "national",
    "Вазирлар Маҳкамаси": "national",
    "Вазирлик ва идоралар": "national",
    "Марказий банк": "national",
    "Марказий банк вилоят бош бошқармаси": "viloyat",
    "Тижорат банклари бошқаруви": "bank-national",
    "Тижорат банклари вилоят бошқармаси": "bank-viloyat",
    "Ҳуқуқни муҳофаза қилувчи органлар (республика)": "national",
    "Ҳуқуқни муҳофаза қилувчи органлар (ҳудуд)": "viloyat",
    "Ҳуқуқни муҳофаза қилувчи органлар (туман)": "tuman",
    "Вилоят ҳокимлиги": "viloyat",
    "Туман (шаҳар) ҳокимлиги": "tuman",
    "Бошқалар (республика)": "national",
    "Бошқалар (ҳудуд)": "viloyat",
    "Бошқалар (туман)": "tuman"
  };

  function eventScopeSuffix(doc, type){
    const scope = TYPE_SCOPE[type] || 'none';
    if (scope === 'national') return '';
    if (scope === 'viloyat') return '_' + (doc.viloyat || '');
    if (scope === 'tuman') return '_' + (doc.viloyat || '') + '|' + (doc.tuman || '');
    if (scope === 'bank-national') return '_' + (doc.bank || '');
    if (scope === 'bank-viloyat') return '_' + (doc.bank || '') + '|' + (doc.viloyat || '');
    return '_' + (doc.filial || (doc.name + '|' + doc.dept));
  }

  function buildTypeMatrix(docs, keyFn, labelFn, seedList){
    function emptyCounts(){
      const o = {};
      MEETING_TYPES.forEach(function(t){ o[t] = { events: new Map(), leaders: new Set() }; });
      return o;
    }
    const rowsMap = {};
    const totalRow = { label: 'ЖАМИ', typeCounts: emptyCounts(), totalLeaders: new Set(), _docs: docs };

    if (seedList) {
      seedList.forEach(function(s){
        if (!rowsMap[s.key]) {
          rowsMap[s.key] = { label: s.label, sub: s.sub || '', typeCounts: emptyCounts(), totalLeaders: new Set(), _docs: [] };
        }
      });
    }

    docs.forEach(function(doc){
      const key = keyFn(doc);
      if (!rowsMap[key]) {
        rowsMap[key] = { label: labelFn(doc), typeCounts: emptyCounts(), totalLeaders: new Set(), _docs: [] };
      }
      rowsMap[key]._docs.push(doc);
      const leaderId = doc.name + '|' + doc.dept;
      const meetings = (doc.meetings && doc.meetings.length) ? doc.meetings :
        Object.keys(doc.hours || {}).filter(function(t){ return doc.hours[t] > 0; }).map(function(t){ return { type: t, duration: doc.hours[t] }; });
      let participated = false;
      meetings.forEach(function(m){
        if (!m.type || !rowsMap[key].typeCounts[m.type]) return;
        participated = true;
        const eventKey = doc.date + '_' + roundTimeSlot(m.time) + eventScopeSuffix(doc, m.type);
        const dur = m.duration || 0;
        [rowsMap[key], totalRow].forEach(function(target){
          const tc = target.typeCounts[m.type];
          if (!tc.events.has(eventKey)) tc.events.set(eventKey, []);
          tc.events.get(eventKey).push(dur);
          tc.leaders.add(leaderId);
        });
      });
      if (participated) {
        rowsMap[key].totalLeaders.add(leaderId);
        totalRow.totalLeaders.add(leaderId);
      }
    });

    function eventDuration(durArr){
      if (!durArr.length) return 0;
      return durArr.reduce(function(a,b){ return a+b; }, 0) / durArr.length;
    }
    function finalize(row){
      let totalMeetings = 0, totalDuration = 0;
      MEETING_TYPES.forEach(function(t){
        const tc = row.typeCounts[t];
        let dur = 0;
        tc.events.forEach(function(arr){ dur += eventDuration(arr); });
        tc.duration = dur;
        totalMeetings += tc.events.size;
        totalDuration += dur;
      });
      row.totalMeetings = totalMeetings;
      row.totalDuration = totalDuration;
    }
    finalize(totalRow);
    Object.values(rowsMap).forEach(finalize);

    const rows = Object.values(rowsMap).sort(function(a,b){ return a.label.localeCompare(b.label); });
    return { rows: rows, totalRow: totalRow };
  }

  function renderMatrixTable(matrix, opts){
    opts = opts || {};
    const rows = matrix.rows, totalRow = matrix.totalRow;

    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + totalRow.totalMeetings + '</div><div class="label">Жами йиғилиш сони</div></div>' +
      '<div class="stat"><div class="num">' + totalRow.totalLeaders.size + '</div><div class="label">Иштирок этган раҳбарлар сони</div></div>' +
      '<div class="stat"><div class="num">' + rows.length + '</div><div class="label">' + (opts.rowHeader || 'Қатор') + ' сони</div></div>';

    if (!rows.length) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Танланган даврда маълумот топилмади.</div>';
      return;
    }

    window.__lastMatrixRows = rows;

    let html = '<table class="matrix-table"><thead>';
    html += '<tr><th class="idx-col" rowspan="2">Т/р</th><th rowspan="2">' + (opts.rowHeader || 'Ном') + '</th>' +
      '<th colspan="3">Жами ўтказилган йиғилишлар</th>' +
      '<th colspan="' + (MEETING_TYPES.length * 3) + '">шундан</th></tr>';
    html += '<tr><th class="grp-first" title="Йиғилиш сони">сони</th><th title="Иштирок этган раҳбарлар сони">иштирокчи</th><th title="Давомийлиги (соат)">соат</th>';
    MEETING_TYPES.forEach(function(t, i){
      html += '<th class="grp-first">' + escapeHtml(t) + '<br><span class="cnt-col" title="Йиғилиш сони">сони</span></th>' +
        '<th><span class="cnt-col" title="Иштирок этган раҳбарлар сони">иштирокчи</span></th>' +
        '<th><span class="cnt-col" title="Давомийлиги (соат)">соат</span></th>';
    });
    html += '</tr></thead><tbody>';

    function cellVal(n){ return n ? n : ''; }
    function cellDur(n){ return n ? n.toFixed(1).replace('.', ',') : ''; }
    function rowCells(r){
      let c = '<td class="grp-first">' + cellVal(r.totalMeetings) + '</td><td>' + cellVal(r.totalLeaders.size) + '</td><td>' + cellDur(r.totalDuration) + '</td>';
      MEETING_TYPES.forEach(function(t){
        const tc = r.typeCounts[t];
        c += '<td class="grp-first">' + cellVal(tc.events.size) + '</td><td>' + cellVal(tc.leaders.size) + '</td><td>' + cellDur(tc.duration) + '</td>';
      });
      return c;
    }

    html += '<tr class="total-row"><td></td><td>ЖАМИ</td>' + rowCells(totalRow) + '</tr>';

    const showBankLogo = opts.rowHeader === 'Банк';
    rows.forEach(function(r, ri){
      const clickable = opts.onRowClick || opts.onLeafClick;
      const rowClass = opts.onRowClick ? ' class="drill-row"' : (opts.onLeafClick ? ' class="cell-clickable"' : '');
      const rowClick = clickable ? ' onclick="window.__matrixRowClick(' + ri + ')"' : '';
      const nameHtml = showBankLogo
        ? '<span class="bank-name-wrap">' + bankLogoImg(r.label) + escapeHtml(r.label) + '</span>'
        : escapeHtml(r.label);
      html += '<tr' + rowClass + rowClick + '><td>' + (ri+1) + '</td><td>' + nameHtml +
        (r.sub ? '<br><span style="font-weight:400;color:#889;font-size:11px">' + escapeHtml(r.sub) + '</span>' : '') +
        '</td>' + rowCells(r) + '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('tableWrap').innerHTML = html;

    window.__matrixRowClick = function(ri){
      const row = rows[ri];
      if (opts.onRowClick) opts.onRowClick(row);
      else if (opts.onLeafClick) opts.onLeafClick(row);
    };
  }

  function showDetailForLeader(docs, title){
    document.getElementById('detailTitle').textContent = title;
    const list = document.getElementById('detailList');
    let items = [];
    docs.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(d){
      const meetings = (d.meetings && d.meetings.length) ? d.meetings :
        Object.keys(d.hours || {}).filter(function(t){ return d.hours[t] > 0; }).map(function(t){ return { type: t, duration: d.hours[t] }; });
      meetings.forEach(function(m){
        const timePart = m.time ? (m.time + ' — ') : '';
        items.push('<li><span>' + fmtDate(d.date) + ': ' + timePart + escapeHtml(m.type) + '</span><span>' + (m.duration || '') + ' соат</span></li>');
      });
    });
    list.innerHTML = items.join('') || '<li>Маълумот йўқ</li>';
    document.getElementById('detail').style.display = 'flex';
  }

  // Умумий "ичкари кириб бориш" функцияси: levels — масалан [Банк, Вилоят, Туман]
  // drillPath.length ҳали levels.length'дан кам бўлса — навбатдаги даражани кўрсатади;
  // барча даражалар танлангач — шу кесимдаги раҳбарлар рўйхатини (матрица жадвал) кўрсатади.
  function renderDrillTab(levels){
    const docs = lastDocs;
    const bc = document.getElementById('breadcrumb');
    bc.style.display = 'block';

    let filtered = docs;
    levels.forEach(function(lvl, i){
      if (i < drillPath.length) {
        filtered = filtered.filter(function(d){ return d[lvl.field] === drillPath[i]; });
      }
    });

    let crumbs = ['<a onclick="window.__bcTo(0)">Барчаси</a>'];
    drillPath.forEach(function(val, i){
      crumbs.push('<a onclick="window.__bcTo(' + (i+1) + ')">' + escapeHtml(val) + '</a>');
    });
    bc.innerHTML = crumbs.join(' &rsaquo; ');
    window.__bcTo = function(depth){ drillPath = drillPath.slice(0, depth); renderCurrent(); };

    // LEADERS_DATA'дан жорий йўлга мос келувчи маълумотнома ёзувлари (0 қаторларни қуриш учун)
    let refs = LEADERS_DATA;
    levels.forEach(function(lvl, i){
      if (i < drillPath.length) {
        refs = refs.filter(function(r){ return r[REF_FIELD[lvl.field]] === drillPath[i]; });
      }
    });

    if (drillPath.length < levels.length) {
      const lvl = levels[drillPath.length];
      const nextLvl = levels[drillPath.length + 1];
      const refField = REF_FIELD[lvl.field];

      const seedLabels = Array.from(new Set(refs.map(function(r){ return r[refField]; }))).filter(Boolean);
      const seedList = seedLabels.map(function(label){ return { key: label, label: label }; });

      const matrix = buildTypeMatrix(filtered,
        function(d){ return d[lvl.field]; },
        function(d){ return d[lvl.field] || '(номаълум)'; },
        seedList);

      renderMatrixTable(matrix, {
        rowHeader: lvl.label,
        onRowClick: function(row){ drillPath = drillPath.concat([row.label]); renderCurrent(); }
      });
      return;
    }

    // Барча даражалар танланган — раҳбарлар рўйхати (матрица), филиал бўйича 0 қаторлар билан
    const seedList = refs.map(function(r){
      return { key: r.f, label: r.n || r.f, sub: r.b + ' — ' + r.f };
    });
    const matrix = buildTypeMatrix(filtered,
      function(d){ return d.filial; },
      function(d){ return d.name; },
      seedList);
    matrix.rows.forEach(function(r){
      if (!r.sub && r._docs[0]) r.sub = r._docs[0].dept;
    });
    renderMatrixTable(matrix, {
      rowHeader: 'Раҳбар',
      onLeafClick: function(row){ showDetailForLeader(row._docs, row.label); }
    });
  }

  function fmtDate(iso){ const p = iso.split('-'); return p[2] + '.' + p[1]; }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

</script>
